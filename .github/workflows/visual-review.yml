name: KiCad visual review
on:
  pull_request:
    paths:
      - '**/*.kicad_sch'
      - '**/*.kicad_pcb'
  workflow_dispatch:
    inputs:
      base:
        description: Base revision for a manual comparison
        default: HEAD~1
        type: string
      head:
        description: Head revision for a manual comparison
        default: HEAD
        type: string
permissions:
  contents: read
jobs:
  visual-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad
          kicad-cli version
      - name: Install visual review tool
        run: python -m pip install .
      - name: Verify native renderer and revision comparison
        run: python -m unittest tests.test_ci tests.test_native_render -v
      - name: Render changed designs
        id: review
        uses: ./
        with:
          base: ${{ github.event.pull_request.base.sha || inputs.base }}
          head: ${{ github.event.pull_request.head.sha || inputs.head }}
          merge-base: ${{ github.event_name == 'pull_request' }}
          output-directory: kicad-review
      - name: Upload visual reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kicad-visual-review
          path: ${{ steps.review.outputs.report || 'kicad-review/' }}
          if-no-files-found: ignore
