name: Test and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned 3D test dependency
        run: npm install --prefix .vizdiff/build-deps --no-save --no-package-lock --ignore-scripts --no-audit --no-fund three@0.171.0
      - name: Install Python test dependencies
        run: python -m pip install '.[github]'
      - name: Run all release gates, tests and packaging
        run: python scripts/release.py --output dist/release
      - name: Retain verified packages and release evidence
        uses: actions/upload-artifact@v7
        with:
          name: verified-packages-${{ github.run_id }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
