name: Test and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned 3D test dependency
        run: mkdir -p .vizdiff/build-deps && cp scripts/build-deps/package*.json .vizdiff/build-deps/ && npm ci --prefix .vizdiff/build-deps --ignore-scripts --no-audit --no-fund
      - name: Install Python test dependencies
        run: python -m pip install --only-binary=:all: --require-hashes -r scripts/requirements-linux.lock && python -m pip install --no-deps --no-build-isolation .
      - name: Run all release gates, tests and packaging
        run: python scripts/release.py --output dist/release
      - name: Retain verified packages and release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-packages-${{ github.run_id }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
