name: Publish prerelease

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish, such as v0.11.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Validate requested tag before checkout
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Use an existing version tag such as v0.11.3.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'tag={tag}\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record the exact tag commit
        id: commit
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          RELEASE_SHA=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test "$RELEASE_SHA" = "$(git rev-parse HEAD)"
          printf 'commit=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned 3D test dependency
        run: mkdir -p .vizdiff/build-deps && cp scripts/build-deps/package*.json .vizdiff/build-deps/ && npm ci --prefix .vizdiff/build-deps --ignore-scripts --no-audit --no-fund
      - name: Install Python test dependencies
        run: python -m pip install --only-binary=:all: --require-hashes -r scripts/requirements-linux.lock && python -m pip install --no-deps --no-build-isolation .
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools'
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: Stage Android assets and build phone/tablet packages
        run: |
          python scripts/package_android.py
          bash android-app/gradlew -p android-app --no-daemon assembleDebug lintDebug bundleRelease
      - name: Run gates and tests, verify tag versions, build release assets
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: python scripts/release.py --tag "$RELEASE_TAG" --android --output dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.tag.outputs.tag }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # This job never checks out or executes repository code with a write token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: dist/release
      - name: Verify downloaded asset checksums
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish tested assets as a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.commit }}
        run: |
          REMOTE_SHA=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$REMOTE_SHA" = "$RELEASE_SHA"
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists for this verified source tag; preserving its uploaded assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/release/* \
            --repo "$GH_REPO" --verify-tag --prerelease \
            --title "KiCad Visual Review $RELEASE_TAG" \
            --notes-file dist/release/RELEASE-NOTES.md
