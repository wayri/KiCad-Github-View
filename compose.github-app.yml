services:
  review:
    build:
      context: .
      dockerfile: Dockerfile.github-app
    ports:
      - "${VIZDIFF_BIND_IP:-127.0.0.1}:8780:8780"
    environment:
      VIZDIFF_PUBLIC_URL: ${VIZDIFF_PUBLIC_URL:?Set the HTTPS service origin}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set the GitHub App webhook secret}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?Set the registered GitHub App ID}
      GITHUB_APP_INSTALL_URL: ${GITHUB_APP_INSTALL_URL:?Set the GitHub installation URL}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_app_key
      VIZDIFF_STATE_DB: /var/lib/kicad-review/deliveries.sqlite3
    secrets:
      - github_app_key
    volumes:
      - app-state:/var/lib/kicad-review
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/health', timeout=5).close()"]
      interval: 30s
      timeout: 6s
      retries: 3
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
secrets:
  github_app_key:
    file: ${GITHUB_PRIVATE_KEY_FILE:?Set the private key file on the deployment host}
volumes:
  app-state:
