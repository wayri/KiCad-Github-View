# Include in nginx http {}. Replace domain and certificate paths before use.
# Rate and connection keys use the socket peer, never forwarded headers.
limit_req_zone $binary_remote_addr zone=review_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=review_conn:10m;
server {
    listen 443 ssl;
    server_name review.example.com;
    ssl_certificate /etc/letsencrypt/live/review.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/review.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_header_timeout 10s;
    client_body_timeout 10s;
    client_max_body_size 1m;
    limit_req zone=review_rate burst=20 nodelay;
    limit_conn review_conn 10;
    # Stream the webhook body to the application's absolute I/O deadline.
    location = /api/github/webhook {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host review.example.com;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host review.example.com;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
    }
}
