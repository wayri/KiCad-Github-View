<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KiCad conflict resolution</title><link rel="stylesheet" href="conflict-viewer.css"></head><body>
<header><div class="identity"><strong>Resolve KiCad conflicts</strong><small id="conflictPath"></small></div><span id="conflictCount"></span><button id="toggleChangeLabels" aria-pressed="true">Change labels</button><button id="toggleMovement" aria-pressed="true">Selected movement</button><button id="toggleFieldValues" aria-pressed="false" title="Show fields at their saved visible positions. Hidden fields stay hidden.">Show field values</button><button id="toggleProperties" aria-pressed="true">Properties</button><button id="fitVersions">Fit both</button><label><input id="linkViews" type="checkbox" checked>Linked views</label><button id="toggleChanges" aria-pressed="true">Highlight changes</button></header>
<p id="conflictStatus" role="status">Loading saved conflict versions…</p>
<main><section id="currentPane"><div class="pane-heading"><div><strong>Current · ours</strong><small id="currentSummary"></small></div><button id="acceptCurrent" aria-pressed="false" disabled>Use current</button></div><div class="pane-content"><div id="currentDrawing" class="drawing" aria-label="Current saved KiCad version"></div><aside id="currentProperties" class="properties" aria-label="Current properties"><div class="properties-heading"><strong id="currentObject">Properties</strong><div id="currentPresence" class="object-presence" role="status"></div><input id="currentPropertySearch" type="search" placeholder="Find a property…" aria-label="Search current properties"></div><div id="currentPropertyRows"></div></aside></div></section><section id="incomingPane"><div class="pane-heading"><div><strong>Incoming · theirs</strong><small id="incomingSummary"></small></div><button id="acceptIncoming" aria-pressed="false" disabled>Use incoming</button></div><div class="pane-content"><div id="incomingDrawing" class="drawing" aria-label="Incoming saved KiCad version"></div><aside id="incomingProperties" class="properties" aria-label="Incoming properties"><div class="properties-heading"><strong id="incomingObject">Properties</strong><div id="incomingPresence" class="object-presence" role="status"></div><input id="incomingPropertySearch" type="search" placeholder="Find a property…" aria-label="Search incoming properties"></div><div id="incomingPropertyRows"></div></aside></div></section></main>
<details id="differenceDetails"><summary id="differenceSummary">Saved-object differences</summary><div id="differenceRows"></div></details>
<footer><div><strong id="chosenVersion">Choose a version to keep</strong><small id="gitStatus">Original file stays unchanged until you save. Each choice accepts that side across all conflicts.</small></div><button id="saveCopy" disabled>Save resolved copy…</button><button id="saveOriginal" disabled>Replace conflicted file…</button><button id="stageResolved" hidden disabled>Stage resolved file…</button></footer>
<script src="design-diff.js"></script><script src="merge-conflicts.js"></script><script src="file-compatibility.js"></script><script src="worksheet.js"></script><script src="schematic-renderer.js"></script><script src="pcb-renderer.js"></script><script src="owned-canvas.js"></script><script src="conflict-properties.js"></script><script src="conflict-viewer.js"></script></body></html>
