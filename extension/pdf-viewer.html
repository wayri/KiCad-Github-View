<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket KiView PDF viewer</title><link rel="stylesheet" href="pdf-viewer.css"><link rel="stylesheet" href="ui-foundation.css"><link rel="stylesheet" href="tool-header.css"><link rel="stylesheet" href="section-pages.css"><link rel="stylesheet" href="phone-polish.css"></head><body class="kiview-tool kiview-pdf">
<header><button id="back" class="icon-only" aria-label="Back to project" title="Back to project"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5m6-6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><strong id="title">PDF viewer</strong><label class="file">Open PDF <input id="files" type="file" accept="application/pdf,.pdf"></label><button id="repository">Project PDFs</button><button id="closeDocument">Close document</button></header>
<nav aria-label="PDF controls"><button id="previous" class="icon-only" aria-label="Previous page"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m15 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><label>Page <input id="page" type="number" min="1" value="1" aria-label="PDF page"></label><span id="pages">/ 0</span><button id="next" class="icon-only" aria-label="Next page"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="zoomOut" class="icon-only" aria-label="Zoom out"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span id="zoom">100%</span><button id="zoomIn" class="icon-only" aria-label="Zoom in"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14M12 5v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="fit">Fit width</button><button id="rotate">Rotate</button><button id="textToggle" aria-pressed="false">Page text</button><form id="searchForm"><input id="search" type="search" aria-label="Find PDF text" placeholder="Find text…" maxlength="200"><button id="find">Find</button><button id="stopSearch" type="button">Stop</button></form></nav>
<p id="status" role="status">Open a PDF to read it here. Documents are processed locally.</p>
<div class="workspace"><aside id="sidebar" hidden><section id="projectFiles"></section><section id="outline"></section><section id="matches"></section></aside><main id="viewport" tabindex="0" aria-label="PDF page viewport"><canvas id="canvas" hidden aria-label="Rendered PDF page"></canvas><pre id="pageText" hidden></pre></main></div>
<dialog id="passwordDialog"><form id="passwordForm"><h2>PDF password</h2><p>This password is used only to open this document in this session.</p><input id="password" type="password" autocomplete="off" aria-label="PDF password"><button>Open</button><button id="cancelPassword" type="button">Cancel</button></form></dialog>
<script src="ui-icons.js"></script><script src="responsive-controls.js"></script><script src="section-pages.js"></script><script src="local-runtime.js"></script><script src="pdf-tools.js"></script><script type="module" src="pdf-viewer.js"></script><script src="tool-header.js"></script></body></html>
