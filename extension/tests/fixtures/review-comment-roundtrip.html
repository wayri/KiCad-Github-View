<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production review comment roundtrip — local provider test</title>

<body>

<iframe id="productionViewer" title="Production review workspace with an in-memory provider"></iframe>
<script src="../../review-comments.js"></script>
<script>

async function route(message){
 const type=message.type;

  if(isNew)store.set(number,{kind,number,id:String(number),title:message.title||message.comment.text.split('\n')[0],state:'open',url,author:'local-reviewer',body,categoryId:message.categoryId||null,createdAt:time,updatedAt:time,comments:[],capabilities:{create:true,reply:true,edit:true}});
  else {const value=store.get(number);if(!value)throw Error('Choose an existing local test conversation.');const id=String(nextComment++);value.comments.push({id,author:'local-reviewer',body,url:url+'#'+(kind==='discussion'?'discussioncomment-':'issuecomment-')+id,createdAt:time,updatedAt:time,canReply:true,canEdit:false});value.updatedAt=time;}
  counters[kind==='discussion'?'discussionPosts':'issuePosts']++;accepted=true;const receipt={remoteRef:{kind,repository:fixtureScope.repository,number,url,publishedAt:time}};receipts.set(key,receipt);show('Provider accepted the POST. Inspect the body and the production success state.');return receipt;
 }

  const row={id,author:'local-reviewer',body,url:value.url+'#'+(value.kind==='discussion'?'discussioncomment-':'issuecomment-')+id,createdAt:time,updatedAt:time,replyTo:message.replyTo||null,canReply:true,canEdit:!message.annotation},at=value.comments.findIndex(old=>old.id===id);if(at>=0)value.comments[at]={...row,createdAt:value.comments[at].createdAt};else value.comments.push(row);value.updatedAt=time;
  counters.chatPosts++;accepted=true;const receipt={provider:'github',kind:value.kind,number:value.number,messageId:id,author:row.author,createdAt:row.createdAt,updatedAt:time,url:row.url,replyTo:row.replyTo};receipts.set(key,receipt);show();return receipt;
 }
 if(type==='github-thread-read'){counters.threadReads++;show();if(failReads())throw Error('Simulated provider readback failure after accepted POST');return thread(message.number,message.kind);}
 if(type==='chat-thread-list'){counters.catalogReads++;show();if(failReads())throw Error('Simulated catalog readback failure');return{threads:[...(message.kind==='discussion'?discussions:issues).values()].map(value=>({kind:value.kind,number:value.number,title:value.title,state:value.state,url:value.url,author:value.author,updatedAt:value.updatedAt})),hasMore:false};}
 if(type==='github-annotations'||type==='comment-remote-list'){counters.annotationReads++;show();if(failReads())throw Error('Simulated annotation readback failure after accepted POST');const selected=message.discussionNumber?[discussions.get(message.discussionNumber)].filter(Boolean):message.issueNumber?[issues.get(message.issueNumber)].filter(Boolean):[...issues.values(),...(message.includeDiscussions?[...discussions.values()]:[])];return{notes:selected.flatMap(value=>KiCadReviewComments.threadAnnotations(thread(value.number,value.kind),fixtureScope)),warnings:[]};}
 if(type==='project-inventory')return{files:[{path:fixtureScope.file,size:drawing.length}],snapshotRef:fixtureScope.ref,warnings:[]};
 if(type==='project-file'){if(message.file!==fixtureScope.file)throw Error('Only the retained fixture drawing is available.');return{path:fixtureScope.file,content:drawing};}
 if(type==='repository-tree')return{entries:[{path:fixtureScope.file,name:fixtureScope.file,type:'file'}],hasMore:false};
 if(type==='saved-rule-findings')return[];
 if(type==='open-options')return{opened:false,reason:'No account or provider connection exists in this local test.'};
 if(type==='health'||type==='ping')return{version:'fixture',ready:true};
 return[];
}
window.fixtureChrome={runtime:{id:'local-provider-test',getURL:name=>new URL('/extension/'+name,location.href).href,sendMessage:async message=>{try{return{ok:true,result:await route(message)}}catch(error){return{ok:false,error:error.message}}},onMessage:{addListener(){}}},storage:{local:{get:async key=>({[key]:preferenceStore.get(key)}),set:async values=>{for(const [key,value]of Object.entries(values))preferenceStore.set(key,value);},remove:async key=>preferenceStore.delete(key)}}};
function byId(id){return currentWindow?.document.getElementById(id);}
function textDraft(text){const input=byId('commentText');if(!input||byId('commentEditor').hidden)throw Error('Create a point, area or new draft first.');input.value=text;input.dispatchEvent(new currentWindow.Event('input',{bubbles:true}));input.focus();}
function on(id,work){document.getElementById(id).onclick=async()=>{try{if(!currentWindow)throw Error('Wait for the production viewer.');await work();show();}catch(error){errors.push(error.message);show(error.message);}};}
function openViewer(){for(const button of controls)button.disabled=true;currentWindow=null;canvas=null;show('Loading the production viewer; local provider state and consent are retained.');frame.srcdoc=template;}
frame.addEventListener('load',()=>{if(!frame.contentWindow.KiCadReviewWorkspace)return;try{
 const w=frame.contentWindow,d=w.document;currentWindow=w;w.addEventListener('error',event=>{errors.push(event.message);show();});w.addEventListener('unhandledrejection',event=>{errors.push(String(event.reason?.message||event.reason));show();});
 d.addEventListener('click',event=>{const link=event.target.closest?.('a[href]');if(link&&new URL(link.href,location.href).origin!==location.origin){event.preventDefault();show('External navigation blocked by the local test fixture.');}},true);
 const ast=w.KiCadDesignDiff.parse(drawing),design=w.KiCadSchematicRenderer.build(ast,fixtureScope.file),files=[{path:fixtureScope.file,content:drawing}],designs=new w.Map([[fixtureScope.file,design]]);
 d.getElementById('status')?.remove();d.getElementById('frameControls').hidden=false;d.getElementById('viewerKind').textContent='Local comment roundtrip';d.getElementById('activeSheet').textContent=fixtureScope.file;d.getElementById('refBadge').textContent='Fixture revision';

 const workspace=w.KiCadReviewWorkspace.mount({...fixtureScope,rootFile:fixtureScope.file,files,pcb:false,getCanvas:()=>canvas,currentFile:()=>fixtureScope.file,getDesigns:()=>designs,focus:position=>{canvas.viewport.camera.center.x=position.x;canvas.viewport.camera.center.y=position.y;canvas.draw();},openSheet(){},onCommentsChanged:()=>show()});
 const ownedCanvas=canvas,draw=canvas.draw.bind(canvas);canvas.draw=()=>{draw();workspace.draw();};workspace.attachCanvas(canvas);canvas.zoom_to_page();canvas.draw();
 d.getElementById('fitDrawing').onclick=()=>{canvas.zoom_to_board();canvas.draw();};d.getElementById('fitPage').onclick=()=>{canvas.zoom_to_page();canvas.draw();};for(const [id,factor]of [['zoomIn',1.25],['zoomOut',.8]])d.getElementById(id).onclick=()=>{canvas.viewport.camera.zoom*=factor;canvas.draw();};
 let observedOpen=false;const observer=new w.MutationObserver(()=>{const dialogs=[...d.querySelectorAll('dialog[open]')].filter(dialog=>dialog.id==='commentPostReview'||dialog.classList.contains('chat-send-review')),open=dialogs.length>0;if(open&&!observedOpen){counters.reviewDialogs++;if(dialogs.some(dialog=>{const input=dialog.querySelector('.content-rules-acceptance input');return input&&!input.checked;}))counters.consentDialogs++;show();}observedOpen=open;});observer.observe(d.body,{subtree:true,attributes:true,attributeFilter:['open']});
 w.addEventListener('pagehide',()=>{observer.disconnect();workspace.dispose();ownedCanvas.dispose();},{once:true});w.addEventListener('resize',()=>{ownedCanvas.resize();ownedCanvas.draw();});
 for(const button of controls)button.disabled=false;show('Ready. Public custom-fields schematic copy includes the owned root UUID shown in the metadata. Use the production Send/Terms/Locate controls. Consent persists across Reload viewer.');
 }catch(error){errors.push(error.stack||error.message);show('Initialization failed: '+error.message);}});
on('placePoint',()=>{byId('pointComment').click();const point=canvas.viewport.camera.world_to_screen({x:100,y:80}),rect=canvas.canvas.getBoundingClientRect();canvas.canvas.dispatchEvent(new currentWindow.MouseEvent('click',{bubbles:true,cancelable:true,clientX:rect.left+point.x,clientY:rect.top+point.y}));textDraft('Point note at 100, 80 mm. Ask @alice to review it.');show('Point tool used actual canvas click handling. Send with the production arrow; first acceptance should appear only once.');});
on('armArea',()=>{byId('areaComment').click();show('Drag an area in the actual drawing, then type and send in the production composer. The provider body must retain normalized Start/End, file, revision and sheet UUID.');});
on('newDiscussion',()=>{byId('newComment').click();byId('editorThreadType').value='discussion';byId('editorThreadType').dispatchEvent(new currentWindow.Event('change',{bubbles:true}));textDraft('New local Discussion. Choose Design review or General before sending.');show('New Discussion draft only: no provider POST yet. Existing categories load automatically; choose the intended category in the production destination controls.');});
on('newText',()=>{byId('newComment').click();textDraft('Second local test note; accepted installation consent should not repeat.');});
on('injectRemoteIssue',()=>{const time=stamp(),note={id:'reverse-area',text:'Provider-side area note from Alice. Select Locate to return to the saved area.',createdAt:time,threadType:'issue',anchor:{...fixtureScope,sheetUuid:fixtureRootUuid,sheetName:fixtureScope.file,kind:'drawing',position:{x:107.5,y:85},area:{x:100,y:80,width:15,height:10}}};lastBody=KiCadReviewComments.toMarkdown(note);issues.set(77,{kind:'issue',number:77,id:'77',title:'Remote injected area review',state:'open',url:issueUrl(77),author:'alice',body:lastBody,createdAt:time,updatedAt:time,comments:[{id:'177',author:'bob',body:'Observed participant Bob can be mentioned with @bo.',url:issueUrl(77)+'#issuecomment-177',createdAt:time,updatedAt:time,canReply:true}],capabilities:{create:true,reply:true,edit:true}});show('Remote issue #77 changed only the in-memory provider. Visible catalog/annotation polling or Open remote issue imports it.');});
on('openRemoteIssue',async()=>{if(!issues.has(77))throw Error('Inject remote issue #77 first.');if(byId('commentsSidebar').hidden)byId('commentsButton').click();byId('commentThreadKind').value='issue';byId('commentThreadNumber').value='77';byId('commentThreadLoad').click();});
on('restoreReads',()=>{document.getElementById('failReadback').checked=false;document.getElementById('failLinkage').checked=false;currentWindow.dispatchEvent(new currentWindow.Event('online'));byId('refreshGitHub').click();show('Readback restored. Refresh or reopen the conversation to merge provider-confirmed content.');});

(async()=>{for(const button of controls)button.disabled=true;const [html,source]=await Promise.all([fetch('/extension/revision-viewer.html').then(response=>{if(!response.ok)throw Error('Viewer template unavailable');return response.text();}),fetch('/extension/tests/fixtures/kicad8/custom_fields.kicad_sch').then(response=>{if(!response.ok)throw Error('Retained public schematic unavailable');return response.text();})]);drawing=source.replace(/\(kicad_sch\b/,'(kicad_sch (uuid "'+fixtureRootUuid+'")');const parsed=new DOMParser().parseFromString(html,'text/html');parsed.querySelector('script[src="revision-viewer.js"]')?.remove();const base=parsed.createElement('base');base.href=new URL('/extension/',location.href).href;parsed.head.prepend(base);const shim=parsed.createElement('script');shim.textContent='window.chrome=parent.fixtureChrome;Object.defineProperty(window,"localStorage",{value:parent.fixtureStorage,configurable:true});window.open=()=>null;';parsed.head.insertBefore(shim,base.nextSibling);template='<!doctype html>'+parsed.documentElement.outerHTML;openViewer();})().catch(error=>{errors.push(error.stack||error.message);show(error.message);});
