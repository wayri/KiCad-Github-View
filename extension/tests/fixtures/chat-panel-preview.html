<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversation UI fixture</title>
<link rel="stylesheet" href="../../revision-viewer.css"><link rel="stylesheet" href="../../chat-panel.css">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--panel);display:flex;flex-direction:column}#fixtureControls{display:flex;flex-wrap:wrap;gap:4px;padding:5px;flex:none;border-bottom:1px solid var(--line);font:12px system-ui}#fixtureStatus{width:100%}#commentsSidebar{display:flex!important;position:relative!important;inset:auto!important;width:100%!important;max-width:none!important;flex:1;min-height:0;box-sizing:border-box;border:0;box-shadow:none}#commentsPane{flex:1;width:100%;height:100%;box-sizing:border-box}#commentThreadMessages{height:100%}</style></head>
<body><nav id="fixtureControls" aria-label="Local deterministic provider controls"><button id="simulateAcceptedPost">Accepted POST + failed readback</button><button id="restoreReadback">Restore readback</button><button id="injectRemoteMessage">New remote message</button><button id="toggleConversation">Hide conversation</button><output id="fixtureStatus" aria-live="polite">Local adapter only. No network provider writes.</output></nav><aside id="commentsSidebar" class="chat-active"><section id="commentsPane" class="chat-active"><div id="commentThreadMessages"></div></section></aside>
<script src="../../review-comments.js"></script><script src="../../comment-compose.js"></script><script src="../../chat-content.js"></script><script src="../../chat-panel.js"></script>
<script>
'use strict';
const scope={repository:'example/power-board',ref:'a'.repeat(40),file:'power.kicad_pcb'};
window.fixtureWrites=[];window.fixtureConfirmations=[];window.fixtureReads=0;
let failReadback=false,acceptNext=false,nextId=104;const receipts=new Map();
const base='https://github.com/example/power-board/issues/24',fixtureThread={kind:'issue',number:24,title:'Power stage review',state:'open',id:'24',url:base,author:'mira',body:'The placement update is ready for review. Please check the return path around **U3** before we close this issue.',createdAt:'2026-10-27T09:00:00Z',updatedAt:'2026-10-27T09:00:00Z',comments:[
 {id:'101',author:'alex',body:'The ground connection looks clear in 2D. Can we move the test point slightly away from the connector?',createdAt:'2026-10-27T09:08:00Z',updatedAt:'2026-10-27T09:08:00Z',canReply:true},
 {id:'102',author:'mira',body:'Yes — I have marked the area.\n\n- Keep the probe clearance\n- Recheck the 3D enclosure fit',createdAt:'2026-10-27T09:12:00Z',updatedAt:'2026-10-27T09:12:00Z',canReply:true,canEdit:true},
 {id:'103',author:'alex',body:'Thanks. I will check that against the saved board revision.',createdAt:'2026-10-27T09:14:00Z',updatedAt:'2026-10-27T09:14:00Z',canReply:true}
],capabilities:{create:true,reply:true,edit:true}};
const counters=()=>document.getElementById('fixtureStatus').textContent='Local adapter · accepted POSTs: '+fixtureWrites.length+' · GETs: '+fixtureReads+' · readback '+(failReadback?'failing':'available')+' · no live provider requests';
window.fixturePanel=KiCadChatPanel.mount({container:document.getElementById('commentThreadMessages'),repository:scope.repository,getScope:()=>scope,onBack:()=>{},onClose:()=>{},onAccount:()=>{},onSettings:()=>{},
 request:async(type,value)=>{if(type==='comment-mention-users')return{users:[{login:'mira',name:'Mira Khan'}]};if(type!=='chat-message-write')throw Error('Unsupported local fixture request');if(receipts.has(value.clientMutationId))return{...receipts.get(value.clientMutationId),duplicate:true};fixtureWrites.push(value);const id=String(nextId++),updatedAt=new Date().toISOString(),row={id,author:'local-reviewer',body:value.annotation?KiCadReviewComments.toMarkdown(value.annotation):value.body,createdAt:updatedAt,updatedAt,url:base+'#issuecomment-'+id,canReply:true,canEdit:true};fixtureThread.comments.push(row);const receipt={provider:'github',kind:'issue',number:24,messageId:id,author:row.author,createdAt:updatedAt,updatedAt,url:row.url};receipts.set(value.clientMutationId,receipt);counters();return receipt;},
 confirmSend:async value=>{fixtureConfirmations.push(value);const approved=acceptNext;acceptNext=false;return approved;},onRead:async()=>{fixtureReads++;counters();if(failReadback)throw Error('Simulated provider GET failure after accepted POST');fixturePanel.render({...fixtureThread,comments:[...fixtureThread.comments]});return fixtureThread;},onSaveTextDraft:async()=>{},
 createAnnotation:(text,value)=>KiCadReviewComments.validateComment({id:value.id,text,createdAt:'2026-10-27T09:30:00Z',severity:value.severity,state:value.state,anchor:{...scope,reference:'U3',kind:'footprint',uuid:'fixture-u3'}})
});
fixturePanel.render({...fixtureThread,comments:[...fixtureThread.comments]});
document.getElementById('simulateAcceptedPost').onclick=async()=>{failReadback=true;acceptNext=true;const input=document.getElementById('chatMessageText');input.value='Provider confirmed this local message '+nextId+'. Readback fails, but this message stays accepted.';input.dispatchEvent(new Event('input',{bubbles:true}));await document.querySelector('.chat-send').onclick();counters();};
document.getElementById('restoreReadback').onclick=async()=>{failReadback=false;await document.querySelector('.chat-refresh').onclick();counters();};
document.getElementById('injectRemoteMessage').onclick=()=>{failReadback=false;const id=String(nextId++),updatedAt=new Date().toISOString();fixtureThread.comments.push({id,author:'mira',body:'New provider-side reply '+id+' arrived. Visible polling should show it within three seconds.',createdAt:updatedAt,updatedAt,url:base+'#issuecomment-'+id,canReply:true});counters();};
document.getElementById('toggleConversation').onclick=event=>{const host=document.getElementById('commentThreadMessages');host.hidden=!host.hidden;event.currentTarget.textContent=host.hidden?'Show conversation':'Hide conversation';};counters();
</script></body></html>
