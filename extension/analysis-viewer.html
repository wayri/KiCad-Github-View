<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pocket KiVi · Analysis</title><link rel="stylesheet" href="analysis-viewer.css"></head><body>
<header><button id="back" aria-label="Back to project">←</button><div><strong>Analysis &amp; simulation</strong><small id="sourceLabel">Saved results · read-only</small></div><button id="theme" aria-label="Toggle analysis theme">◐</button></header>
<main><label class="file-picker">Result file <select id="file" aria-label="Analysis result file"></select></label><p id="status" role="status">Finding saved reports…</p><div id="warnings" role="note"></div>
<nav aria-label="Analysis views"><button data-tab="graphs" aria-pressed="true">⌁ Graphs</button><button data-tab="tables">▦ Data</button><button data-tab="fields">☷ Report</button><button data-tab="source">{ } Source</button></nav>
<section id="graphs"><label>Plot <select id="plot" aria-label="Choose plot"></select></label><div id="graphEmpty"></div><details id="graphControls"><summary>Signals &amp; axes</summary><div id="signals"></div><label>X axis <select id="xScale"><option value="linear">Linear</option><option value="log">Logarithmic</option></select></label><label>Y axis <select id="yScale"><option value="linear">Linear</option><option value="log">Logarithmic</option></select></label></details><canvas id="chart" aria-label="Saved analysis graph" role="img"></canvas><p id="cursor" role="status"></p><p id="plotLimits" class="meta"></p></section>
<section id="tables" hidden><label>Table <select id="table" aria-label="Choose data table"></select></label><div id="tableHost" class="table-scroll"></div><button id="moreRows" hidden>Show more rows</button><p id="tableStatus" class="meta"></p></section>
<section id="fields" hidden><input id="search" type="search" aria-label="Search report properties" placeholder="Search values, assumptions, checks…"><div id="fieldList"></div></section>
<section id="source" hidden><p class="meta">Saved source text. Commands and report scripts are never executed.</p><pre id="sourceText"></pre></section></main>
<script src="analysis-data.js"></script><script src="analysis-viewer.js"></script></body></html>
