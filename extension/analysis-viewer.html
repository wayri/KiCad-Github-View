<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pocket KiView · Analysis</title><link rel="stylesheet" href="analysis-viewer.css"><link rel="stylesheet" href="ui-foundation.css"><link rel="stylesheet" href="tool-surfaces.css"><link rel="stylesheet" href="workspace-chrome.css"><link rel="stylesheet" href="compact-surfaces.css"></head><body class="kiview-tool tool-surface analysis-tool">
<header><button id="back" class="icon-only" aria-label="Back to project" title="Back to project"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5m6-6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div><strong>Reports &amp; analysis</strong><small id="sourceLabel">Saved results · read-only</small></div><button id="theme" class="icon-only" aria-label="Toggle theme" title="Toggle light and dark theme"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3a9 9 0 1 0 9 9c-6 2-11-3-9-9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></header>
<main><label class="file-picker">Result file <select id="file" aria-label="Analysis result file"></select></label><p id="status" role="status">Finding saved reports…</p><div id="warnings" role="note"></div>
<nav aria-label="Analysis views"><button data-tab="graphs" aria-pressed="true">⌁ Graphs</button><button data-tab="tables">▦ Data</button><button data-tab="fields">☷ Report</button><button data-tab="source">{ } Source</button></nav>
<section id="graphs"><label>Plot <select id="plot" aria-label="Choose plot"></select></label><div id="graphEmpty"></div><div id="overlayControls" hidden><label>View <select id="resultView" aria-label="Result view"><option value="map">Plot / map</option><option value="2d" selected>2D overlay</option><option value="3d">3D overlay</option></select></label><label>Overlay opacity <input id="overlayOpacity" type="range" min="0" max="100" value="75" aria-label="Overlay opacity"></label><button id="overlayFit">Fit overlay</button><p id="overlayStatus" role="status"></p><p id="overlayLegend" class="meta"></p></div><details id="graphControls"><summary>Signals &amp; axes</summary><div id="signals"></div><label>X axis <select id="xScale"><option value="linear">Linear</option><option value="log">Logarithmic</option></select></label><label>Y axis <select id="yScale"><option value="linear">Linear</option><option value="log">Logarithmic</option></select></label></details><label id="frameControl" hidden>Saved time <input id="savedFrame" type="range" min="0" max="0" value="0" step="1" aria-label="Saved thermal frame"><output id="frameTime"></output></label><div id="probeTools"><label id="probeTraceLabel">Probe signal <select id="probeTrace" aria-label="Signal to probe"></select></label><div class="probe-actions"><button id="probeA" aria-pressed="false">Mark A</button><button id="probeB" aria-pressed="false">Mark B</button><button id="probeClear">Clear probes</button></div><p id="probeResult" role="status">Tap the graph to inspect a saved value. Mark A and B to compare two points.</p></div><canvas id="chart" aria-label="Saved analysis graph" role="img"></canvas><div id="overlay2d" hidden></div><div id="overlay3d" hidden></div><p id="probeHistoryLabel" class="meta" hidden></p><canvas id="probeHistory" aria-label="Pinned-point time plot" role="img" hidden></canvas><p id="cursor" role="status"></p><p id="plotLimits" class="meta"></p></section>
<section id="tables" hidden><label>Table <select id="table" aria-label="Choose data table"></select></label><div id="tableHost" class="table-scroll"></div><button id="moreRows" hidden>Show more rows</button><p id="tableStatus" class="meta"></p></section>
<section id="fields" hidden><input id="search" type="search" aria-label="Search report properties" placeholder="Search values, assumptions, checks…"><div id="fieldList"></div></section>
<section id="source" hidden><p class="meta">Saved source text. Commands and report scripts are never executed.</p><pre id="sourceText"></pre></section></main>
<script src="startup-health.js"></script><script src="workspace-chrome.js"></script><script src="local-runtime.js"></script><script src="worksheet.js"></script><script src="file-compatibility.js"></script><script src="design-diff.js"></script><script src="layer-colors.js"></script><script src="pcb-renderer.js"></script><script src="pad-labels.js"></script><script src="owned-canvas.js"></script><script src="touch-canvas.js"></script><script src="vendor/spike-board3d.bundle.js"></script><script src="analysis-data.js"></script><script src="analysis-spatial.js"></script><script src="analysis-overlay.js"></script><script src="analysis-viewer.js"></script><script src="analysis-bom-link.js"></script><script src="compact-surfaces.js"></script></body></html>
